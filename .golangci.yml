version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - gofmt
    - ineffassign
    - unused

  settings:
    gofmt:
      simplify: true

  exclusions:
    rules:
      # Test files don't need to check all errors
      - path: "_test\\.go"
        linters:
          - errcheck
