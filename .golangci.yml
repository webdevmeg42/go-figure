version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused

  exclusions:
    presets:
      - std-error-handling
    rules:
      # Test files don't need to check all errors
      - path: "_test\\.go"
        linters:
          - errcheck

formatters:
  enable:
    - gofmt

  settings:
    gofmt:
      simplify: true
