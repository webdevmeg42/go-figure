linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gofmt
    - gosimple
    - ineffassign
    - unused

linters-settings:
  gofmt:
    simplify: true

issues:
  exclude-rules:
    # Test files don't need to check all errors
    - path: "_test\\.go"
      linters:
        - errcheck
